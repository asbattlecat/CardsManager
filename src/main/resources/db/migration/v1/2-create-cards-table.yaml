databaseChangeLog:
  - changeSet:
      id: 3
      author: ruslan
      changes:
        - createTable:
            tableName: card_entity
            remarks: Банковские карты
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: ID карт
              - column:
                  name: encrypted_number
                  type: VARCHAR(500)
                  constraints:
                    unique: true
                    nullable: false
                  remarks: Зашифрованный номер карт
              - column:
                  name: last_four_digits
                  type: VARCHAR(4)
                  constraints:
                    nullable: false
                  remarks: Последние 4 цифры карт (для маски)
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cards_users
                    references: user_entity(id)
                  remarks: Владельцы карт
              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: Срок действия карт
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: Статус карт (ACTIVE/BLOCKED/EXPIRED)
              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
                  remarks: Текущий баланс карт
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  remarks: Версия для оптимистичной блокировки
  - changeSet:
      id: 4
      author: ruslan
      changes:
        - createIndex:
            tableName: card_entity
            indexName: idx_cards_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: card_entity
            indexName: idx_cards_status
            columns:
              - column:
                  name: status